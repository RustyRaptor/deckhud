[tools]
go = "1.27.3"

[env]
CGO_ENABLED = "0"

[tasks.test]
description = "Run all tests"
depends = ["test:go", "test:qml"]

[tasks."test:go"]
description = "Run Go tests"
run = "go test ./..."

[tasks."test:qml"]
description = "Run QML tests offscreen"
run = "QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 /usr/lib/qt6/bin/qmltestrunner -input ui/tests"

[tasks.check]
description = "Vet and format check"
run = ["go vet ./...", "test -z \"$(gofmt -l .)\"", "/usr/lib/qt6/bin/qmllint ui/components/*.qml ui/main.qml"]

[tasks.build]
description = "Build the daemon"
run = "go build -o bin/deckhudd ./cmd/deckhudd"

[tasks.install]
description = "Install deckhudd, the overlay and the systemd user unit under $HOME (does not enable it)"
depends = ["build"]
run = [
  "install -Dm755 bin/deckhudd ~/.local/bin/deckhudd",
  "rm -rf ~/.local/share/deckhud/ui && mkdir -p ~/.local/share/deckhud && cp -r ui ~/.local/share/deckhud/ui && rm -rf ~/.local/share/deckhud/ui/tests",
  "install -Dm644 packaging/systemd/deckhud.service ~/.config/systemd/user/deckhud.service",
  "systemctl --user daemon-reload",
  "echo 'installed; enable with: systemctl --user enable --now deckhud'",
]

[tasks.uninstall]
description = "Stop and remove deckhud from $HOME"
run = [
  "systemctl --user disable --now deckhud || true",
  "rm -f ~/.local/bin/deckhudd ~/.config/systemd/user/deckhud.service",
  "rm -rf ~/.local/share/deckhud",
  "systemctl --user daemon-reload",
]

[tasks.appimage]
description = "Build the AppImage in a podman container (needs podman)"
depends = ["build"]
run = [
  "podman build -t deckhud-appimage packaging/appimage",
  "podman run --rm -e VERSION=$(git describe --tags --always) -v $PWD:/src/deckhud:Z deckhud-appimage /src/deckhud/packaging/appimage/build.sh",
]
