[tools]
go = "1.27.3"

[env]
CGO_ENABLED = "0"

[tasks.test]
description = "Run all tests"
depends = ["test:go", "test:qml"]

[tasks."test:go"]
description = "Run Go tests"
run = "go test ./..."

[tasks."test:qml"]
description = "Run QML tests offscreen"
run = "QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 /usr/lib/qt6/bin/qmltestrunner -input ui/tests"

[tasks.check]
description = "Vet and format check"
run = ["go vet ./...", "test -z \"$(gofmt -l .)\"", "/usr/lib/qt6/bin/qmllint ui/components/*.qml ui/main.qml"]

[tasks.build]
description = "Build the daemon"
run = "go build -o bin/deckhudd ./cmd/deckhudd"
